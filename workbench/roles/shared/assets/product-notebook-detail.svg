<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1100" viewBox="0 0 640 1100"><rect width="640" height="1100" fill="#f5f2e9"/><text x="320" y="80" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#385d4e">山川手帐</text><text x="320" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#7a8374">一页记录，一份善意</text><rect x="116" y="180" width="408" height="365" rx="10" fill="#e4e9db"/><g transform="rotate(-7 320 350)"><rect x="205" y="210" width="230" height="300" rx="8" fill="#385d4e"/><path d="M225 215v290" stroke="#ffffff40"/><text x="320" y="355" text-anchor="middle" font-family="serif" font-size="25" fill="#e9ddbd">山川手帐</text></g><text x="320" y="621" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#385d4e">留白，容纳每一种想法</text><text x="320" y="666" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#7a8374">A5 随身尺寸 · 日常书写与记录</text><g transform="translate(90 720) rotate(5 230 110)"><rect width="460" height="220" rx="6" fill="#fffdf7" stroke="#d7d4c7"/><path d="M230 0v220M20 45h190M20 80h190M20 115h190M20 150h190M250 45h190M250 80h190M250 115h190M250 150h190" stroke="#dddccc"/></g><text x="320" y="1024" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#385d4e">每售出一件，贡献 10 元公益款</text><text x="320" y="1061" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7a8374">支持乡村阅读，让更多故事被看见</text></svg>